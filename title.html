<body onclick="handleClick(event)">

    </div>
    <div id="b" class="unselect">
        <button id="reset"><a href="">reset</a></button>
    </div>
<script>
function handleClick(event) {
  if (event.target.classList.contains("clickable")) {
    var values = event.target.getAttribute("data-values").split("/");
    var randomIndex = Math.floor(Math.random() * values.length);
    var nextValue = values[randomIndex];
    event.target.innerText = nextValue;
  }
}

let printing = false;

      async function kioskOrBrowserPrint() {
        if (printing) return;
        printing = true;
        try {
          if (window.kioskPrint) {
            const result = await window.kioskPrint.print();
            console.log('print result:', JSON.stringify(result));
            if (result.success) {
              setTimeout(() => location.reload(), 2000);
              return;   // stay locked until the reload happens
            } else if (result.reason !== 'duplicate') {
              console.warn('Print failed:', result.reason);
            }
          } else {
            window.print();
            setTimeout(() => location.reload(), 2000);
            return;
          }
        } catch (err) {
          console.error('print flow error:', err);
        }
        printing = false;   // only unlock if we're not reloading
      }
</script>
