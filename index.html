<script>
function handleClick(event) {
  if (event.target.classList.contains("clickable")) {
    var values = event.target.getAttribute("data-values").split("/");
    var randomIndex = Math.floor(Math.random() * values.length);
    var nextValue = values[randomIndex];
    event.target.innerText = nextValue;
  }
}

const imgEl = document.getElementById('random-image');
const btn = document.getElementById('btn');

const srcArray = ['zine images/zine-image-1.jpg', 'zine images/zine-image-2.jpg','zine images/zine-image-3.jpg','zine images/zine-image-4.jpg', 'zine images/zine-image-5.jpg','zine images/zine-image-6.jpg','zine images/zine-image-7.jpg', 'zine images/zine-image-8.jpg','zine images/zine-image-9.jpg'];

imgEl.src - srcArray[0];

btn.addEventListener('click', () => {
    randomImage();
});

let index;

randomImage();
function randomImage() {
    const randomIndex = Math.floor(Math.random()*srcArray.length);
    if (randomIndex !== index){
    imgEl.src = srcArray[randomIndex];
    index = randomImage;
    } else {
    randomImage();
    }
    
}

imgEl2.src - srcArray2[0];

});

let index2;

randomImage2();
function randomImage2() {
    const randomIndex2 = Math.floor(Math.random()*srcArray2.length);
    if (randomIndex2 !== index2){
    imgEl2.src = srcArray2[randomIndex2];
    index2 = randomImage2;
    } else {
    randomImage2();
    }
    
}
