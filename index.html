<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale-1">
<title>A (Web)Zine for Art's Sake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
<script src=""></script>
</head>

<body>
    <div id="t">
      <h1>
        <button id="toggle" class="textDiv">Art</button>
        <span>for</span>
        <button id="toggle2" class="textDiv2">Art's</button>
        <span>sake</span>
      </h1>
    </div>
    <div id="b" class="unselect">
        <button id="p" onclick="kioskOrBrowserPrint();">print</button>
    </div>
    <nav id="menu" class="m">
        <span><a href="https://fonts.google.com/selection/embed">text</a></span> 
        <span>image</span>
        <span>info</span>
    </nav>
<script>
 let button = document
            .getElementById('toggle');
        button
         .getElementById('toggle2');
        button
            .addEventListener('click', function () {
                if (button.innerText === "Art") {
                    button.innerText = "a (Web)Zine";
                } else {
                    button.innerText = "Art";
                }
            })
             .addEventListener('click', function () {
                if (button.innerText === "Art's") {
                    button.innerText = "a (Web)Zine's";
                } else {
                    button.innerText = "Art's";
                }
            })

let printing = false;

      async function kioskOrBrowserPrint() {
        if (printing) return;
        printing = true;
        try {
          if (window.kioskPrint) {
            const result = await window.kioskPrint.print();
            console.log('print result:', JSON.stringify(result));
            if (result.success) {
              setTimeout(() => location.reload(), 2000);
              return;   // stay locked until the reload happens
            } else if (result.reason !== 'duplicate') {
              console.warn('Print failed:', result.reason);
            }
          } else {
            window.print();
            setTimeout(() => location.reload(), 2000);
            return;
          }
        } catch (err) {
          console.error('print flow error:', err);
        }
        printing = false;   // only unlock if we're not reloading
      }
</script>
</body>
</html>
